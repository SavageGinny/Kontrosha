<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Data Parser{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="/">
            <span class="brand-mark">D</span>
            <span>Data<span class="brand-light">Parser</span></span>
        </a>

        <div class="side-caption">РАБОЧАЯ ОБЛАСТЬ</div>
        <nav class="side-nav">
            <a href="/" class="nav-link {% if active == 'home' %}active{% endif %}">
                <span class="nav-icon">⌂</span> Обзор
            </a>
            <div class="side-caption nav-caption">ПАРСЕРЫ</div>
            <a href="/parser/logs" class="nav-link {% if active == 'logs' %}active{% endif %}">
                <span class="nav-icon">⌁</span> Логи веб-сервера
            </a>
            <a href="/parser/config" class="nav-link {% if active == 'config' %}active{% endif %}">
                <span class="nav-icon">⚙</span> Конфигурация
            </a>
            <a href="/parser/html" class="nav-link {% if active == 'html' %}active{% endif %}">
                <span class="nav-icon">&lt;/&gt;</span> HTML-документ
            </a>
            <a href="/parser/database" class="nav-link {% if active == 'database' %}active{% endif %}">
                <span class="nav-icon">▦</span> База данных
            </a>
        </nav>

        <div class="sidebar-bottom">
            <div class="status-dot"></div>
            <div>
                <div class="status-title">Локальное приложение</div>
                <div class="status-subtitle">FastAPI · Python</div>
            </div>
        </div>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <div class="breadcrumb">Рабочая область <span>/</span> {% block breadcrumb %}Обзор{% endblock %}</div>
            <div class="topbar-right"><span class="live-dot"></span> Система готова</div>
        </header>
        <div class="page-content">
            {% block content %}{% endblock %}
            <footer class="footer">
                <span>DATA PARSER</span>
                <span>Учебный проект · FastAPI</span>
            </footer>
        </div>
    </main>
</div>
</body>
</html>
